[package]
name = "cloudburst"
version = "0.2.0"
description = "A focused desktop interface for qBittorrent"
authors = ["VitroidFPV"]
license = "GPL-3.0-only"
repository = "https://github.com/VitroidFPV/cloudburst"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cloudburst_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
keyring = "4.1.6"
tokio = { version = "1.47.1", features = ["sync"] }
base64 = "0.22.1"

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.7.3"
windows-registry = "0.6.1"
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm"] }
